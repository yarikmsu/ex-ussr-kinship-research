skill: ex-ussr-kinship-research
version: "1.43.0-fork"

# Кейсы для содержательной проверки дополнений форка (references/fork/).
# Это условные ситуации, а не автоматические unit-тесты.
logic_cases:
  - id: fork_namesake_infant_death_before_choice
    request: "В семье говорят, что дед Пётр родился 3 марта 1903 года в селе N. В метрике села N за 1903 год есть Пётр, родившийся ровно 3 марта у другого отца, и Пётр от предполагаемого отца, родившийся 18 февраля. Берём того, у кого дата совпала?"
    expected:
      - "Не выбирать кандидата по совпадению даты с семейной памятью; учесть пересчёт стиля (18 февраля + 13 дней = 3 марта) и возможные именины."
      - "До вывода, в первую очередь, просмотреть смерти того же и следующего года для обоих кандидатов — в той же книге и в отдельных книгах или разделах умерших, а недоступные годы записать в охват: тёзка мог умереть младенцем."
      - "Вести кандидатов отдельными person_id, пока отец, восприемники, смерть или поздние записи их не различат."

  - id: fork_found_infant_death_excludes_only_matched_candidate
    request: "В метрике прихода за 1880 год два кандидата в деда Ивана: Иван, сын Петра и Анны, из деревни N и Иван, сын Петра и Марии, из деревни M. В книге умерших 1881 года — «Иван, сын Петра, 1 год». Брак деда в 1902 году найден в метрике. Один кандидат отпал?"
    expected:
      - "Сопоставить запись о смерти с конкретным ребёнком: по матери, если она названа, по возрасту, деревне и другим признакам; одного имени отца мало."
      - "Исключить кандидата, только если смерть сопоставлена именно с ним и стоит раньше установленного позднего события деда (здесь брака 1902 года); несопоставленная запись никого не исключает."
      - "Пока смерть не сопоставлена, вести обоих кандидатов отдельными person_id и различать по восприемникам и по записи о браке 1902 года (возраст, отец жениха, место)."
      - "Даже если один кандидат исключён, оставшийся ещё не доказан: сверить его с записью о браке 1902 года и восприемниками."

  - id: fork_family_birthday_may_be_name_day
    request: "Прабабушку всегда поздравляли 14 октября; родилась она около 1885 года. В метрике прихода за 1885 год подходящая девочка родилась 27 сентября. Даты не совпадают — это не она?"
    expected:
      - "Не отвергать кандидатку из-за расхождения дат: проверить стиль календаря и возможность, что семья отмечала именины."
      - "Дату метрики 1885 года пересчитать с разницей 12 дней (27 сентября → 9 октября); семейную дату, если это именины, которые отмечали по новому стилю после 1918 года, — с разницей 13 (14 октября → 1 октября ст. ст.)."
      - "Назвать конкретный шаг поиска: если 14 октября — именины, искать рождение в нескольких днях до дня этого святого по старому стилю."
      - "Версию именин проверить по имени: совпадает ли имя прабабушки со святым дня «семейная дата − 13» (1 октября по старому стилю)."
      - "Держать объяснение как гипотезу и проверять родителей, восприемников и другие записи, а не число."

  - id: fork_confession_list_neighbouring_households
    request: "В исповедной ведомости 1840 года дворы вдовы Марфы и Ивана Петрова стоят рядом. Записываем Ивана её сыном?"
    expected:
      - "Не устанавливать родство по соседству дворов; записать соседство отдельным утверждением, связь — hypothesis."
      - "Проверить по более ранней ведомости, где семья могла жить одним двором, и по метрикам."
      - "Учитывать, что ведомости, переписанные из года в год, наследуют ошибки и не дают независимого подтверждения."

  - id: fork_messenger_questionnaire_no_hints
    request: "Составь вопросы тёте в мессенджер. Мы предполагаем, что у деда была сестра Ольга 1925 года рождения. Спросить: «Была ли у деда сестра Ольга?»"
    expected:
      - "Не включать имя и год из гипотезы в рассылаемый текст; спросить открыто о братьях и сёстрах."
      - "Сохранить ожидаемый ответ и различающий признак в плане дела, а не в тексте для семьи."
      - "Писать от лица адресата и убрать вопросы, ответ на которые уже есть."

  - id: fork_relayed_first_person_remark
    request: "Мама созвонилась с тётей и пересказала мне её ответы. Одна фраза: «мне кажется, дед родился в селе N, а не в городе». Запиши в реестр, что тётя считает местом рождения деда село N."
    expected:
      - "Не приписывать фразу от первого лица тёте уверенно: при пересказе через посредника это может быть мнение самого посредника."
      - "До правки реестров уточнить у пользователя, чьи это слова, и записать артефакт как пересказ с цепочкой «тётя → мама → пользователь»."
      - "Не повышать статус места рождения по этой реплике; держать как неясное семейное сведение."

  - id: fork_father_alive_from_child_death_formula
    request: "Последнее упоминание Фрола Петрова — исповедная ведомость 1851 года. В 1853 году умер его сын, запись «у крестьянина Фрола Петрова сын». Можно сдвинуть нижнюю границу смерти Фрола?"
    expected:
      - "Считать формулу без «умершаго»/«вдовы» признаком, что отец жив на дату записи, и сдвинуть нижнюю границу его смерти."
      - "Сначала проверить, что запись относится к тому же человеку (деревня, жена, возрасты)."
      - "Записать вывод с указанием записи и чтения формулы по изображению."

  - id: fork_missing_then_demobilised
    request: "У деда два документа: донесение 1943 года «пропал без вести» и книга демобилизованных 1946 года. Источники противоречат — какой верен?"
    expected:
      - "Не объявлять одну запись ошибочной. Частое объяснение (выжил, учёт отстал) использовать как направление поиска послевоенных документов, а не как вывод; причину искать по виду записи о пропаже (со слов семьи в военкомате или донесение части — тогда проверить плен и окружение) и до подтверждения держать неизвестной."
      - "Сохранить обе записи и проверить тождество по году, месту и родственникам перед выводом."
      - "Использовать архив книги демобилизованных как выход на документ и наводку на регион послевоенного учёта; прибытие и проживание оставить непроверенными до других записей."

  - id: fork_ocr_search_zero_with_date_filter
    request: "Поиск по распознанному тексту архива с фильтром dateFrom=1850-01-01&dateTo=1860-12-31 дал 0. Записываем, что брака за эти годы нет?"
    expected:
      - "Не считать ноль поиска отрицательным результатом: фильтр лет принимает только год без месяца и дня; повторить с dateFrom=1850&dateTo=1860."
      - "Проверить словоформы (падеж, старые отчества) и орфографию; различать отсутствие в выдаче, в текстовом слое и на изображении."
      - "Записать запрос, фильтр и фактический охват в журнал."

  - id: fork_pn_birth_year_filter_ranks
    request: "В «Памяти народа» задал ФИО и год рождения 1915. На первой странице два человека 1915 года, на второй — люди 1912 и 1918 годов. Значит, фильтр не работает и вторую страницу можно не смотреть?"
    expected:
      - "Не считать фильтр неработающим и не бросать выдачу: в проверенных запросах фильтр года ранжировал, а не сужал (совпадения вверху, дальше другие годы и отчества); фактическое действие проверить контрольным запросом и листать, пока совпадения не кончатся."
      - "Учесть, что год из семейной памяти мягкий: кандидатов соседних лет не отбрасывать без проверки."
      - "Записать запрос, параметры и просмотренные страницы в журнал."

  - id: fork_archive_reply_blank_form
    request: "Архив ответил на наш запрос письмом без текста, во вложении только бланк заявления. Отмечаем в журнале, что ответ получен?"
    expected:
      - "Записать статус как «запрос не зарегистрирован, нужен бланк», а не «ответ получен»."
      - "Заполнить бланк по правилам формы (один человек на бланк), оставив поля заявителя, дату и подпись пользователю."
      - "Перед отправкой отрисовать подписанный файл и проверить поля, отметки, подпись и число страниц; отправлять только с разрешения пользователя."

  - id: fork_ancestor_gap_sweep
    request: "После трёхсот поисков очередь проверок в research-state.md превратилась в длинный журнал, и я уже не понимаю, у кого из предков что осталось. Как составить план дальше?"
    expected:
      - "Пройти person-register по поколениям и для каждого прямого предка записать пробел и точный источник (шифр или путевую метку)."
      - "Указать для каждого пробела тип доступа (онлайн, вход пользователя, архивный запрос, семья) и отделить шаги агента от решений пользователя."
      - "Упорядочить пробелы по отношению «новое имя предка ÷ стоимость», а не по порядку журнала."

  - id: fork_text_layer_negative_with_count
    request: "По текстовому слою Яндекс Архива в браках прихода за 1830 год искомого жениха нет. Записываем not found или надо листать все изображения раздела?"
    expected:
      - "Сосчитать в текстовом слое записи раздела по слову, которое есть в каждой записи и стоит в той же половине разворота, что и графа жениха (или по обеим половинам), и сверить с итоговой строкой на изображении."
      - "Совпадение — отрицательный результат на уровне текстового слоя с указанием способа проверки, а для существенного вывода — просмотр по изображению записей с подходящими датами или отцами; расхождение — просмотр изображений."
      - "В итоге перечислить одноимённых, если они есть; если браков 1830 года в слое нет совсем, проверить по изображениям, есть ли книга этого года в деле, и не записывать это как «не найдено»."

  - id: fork_strip_match_is_candidate
    request: "Читаем рождения 1830-х узкой полосой по графе имён, ищем Евсевия, сына Петра. На одном снимке полоса как будто читает «Евсевий». Записываем находку? И как быть с книгой 1825 года, где отдельной графы имён нет?"
    expected:
      - "Считать совпадение на полосе кандидатом: проверить запись по полному изображению вместе с графой родителей и только потом записывать."
      - "Если проверка не подтвердила чтение, записать ложное совпадение с кадром и настоящим чтением в журнал."
      - "Книгу без графы имён читать записями целиком или полосой на всю ширину записи и отметить в охвате пониженную надёжность отрицательного результата."

  - id: fork_parish_of_churchless_village
    request: "Деревня N своей церкви не имела. По каталогу FamilySearch выбрали соседний приход с похожим расположением и читаем его книгу 1870 года. Как быстро понять, тот ли это приход, и где искать, если нет?"
    expected:
      - "Выписать деревни с первых страниц рождений, пока записи не покроют несколько месяцев: если крупной деревни N нет за это время, приход, скорее всего, не тот."
      - "Искать историю храма с перечнем ближайших церквей и расстояниями; совпадение посвящений — наводка на материнский приход."
      - "Сверить подпись группы с титулом тома и учесть одноимённые деревни соседних приходов."

  - id: fork_lesson_capture_and_red_check
    request: "Сессия поиска закончилась, мы нашли полезный приём для FamilySearch. Как добавить его в навык?"
    expected:
      - "Записать урок в частный журнал вне навыка, дописывая в конец; обезличивать при переносе в репозиторий."
      - "Сверить урок с текущим текстом навыка, включая основной, и переносить только недостающее."
      - "Составить кейс и прогнать его на навыке без правки (RED) до правки, потом с правкой (GREEN)."
      - "До первого push проверить diff и сообщения коммитов на приватность и отдать правку на ревью свежему исполнителю."

  - id: fork_resume_state_essentials
    request: "Сессия заканчивается, контекст будет сжат. Что записать, чтобы завтра продолжить?"
    expected:
      - "Записать в существующий план блок «читать первым» с точкой продолжения, а также действующие решения и запреты пользователя с датой."
      - "Записать карту источников: тома и диапазоны снимков по разделам, что прочитано полностью и что выборочно."
      - "Следующий ID брать из реестра в момент записи, а не из счётчика в плане."
      - "Держать одну действующую очередь, старые помечать как историю; код помощников для вкладки сохранить в файле дела."

  - id: fork_resume_check_log_before_plan_item
    request: "Продолжаем после сжатия контекста. В плане пункт 7 помечен «не начат», а в пересказе сказано, что последняя запись была около 16:25. Берём пункт 7 и пишем в план время 16:25?"
    expected:
      - "Сначала найти пункт в журнале поисков по ID и цели: статус в плане может отставать от журнала."
      - "Время новой записи брать из часов системы, а время прошлой записи — из самого журнала, а не из пересказа или оценки."
      - "В плане указывать часовой пояс; в реестры писать время в их формате: UTC, ISO 8601."

  - id: fork_archive_channel_and_addendum
    request: "Месяц назад отправили запрос в областной архив по e-mail, в ответ пришёл бланк анкеты на платный тематический поиск. Хотим дописать ещё годы брака. Пишем в план «ожидает ответа» и шлём дополнение?"
    expected:
      - "Проверить, принимает ли архив запросы этим каналом: ответ с бланком значит, что запрос ещё не принят."
      - "Перед дополнением перечитать отправленное письмо."
      - "Учесть, что в платном запросе дополнения могут приниматься только до письма-договора (порядок уточнить у архива), а получив письмо-договор, предложить пользователю попросить электронные копии записей."

  - id: fork_search_verbatim_answers_before_asking
    request: "Готовим новую анкету тёте. В прошлой анкете она пропустила два вопроса. Хотим спросить, кто воспитывал деда после смерти его отца. Добавляем этот вопрос?"
    expected:
      - "Сначала искать по дословным записям прежних ответов всех родственников, в том числе этого человека, а не только по реестрам."
      - "Проверить фразы-закрытия темы и не переспрашивать уже данный короткий ответ."
      - "Пропущенные вопросы прошлой анкеты перенести с пометкой «уже задавали»; вопрос, который тётя обошла намеренно или на чувствительную тему, повторять только по решению пользователя."

  - id: fork_widow_formula_father_is_lead
    request: "В исповедной ведомости 1834 года: «вдова умершего крестьянина Ивана Петрова Марья Ивановна 40, дети её Петр 12, Анна 8». Метрик о рождении детей ещё не смотрели. Записываем Ивана Петрова отцом обоих детей?"
    expected:
      - "Материнство Марьи Ивановны записать как утверждение ведомости, Ивана Петрова — сильной наводкой на отца; отцовство держать в статусе hypothesis."
      - "Назвать следующий поиск: рождения Петра (≈1822) и Анны (≈1826) с отцом Иваном Петровым и брак Ивана Петрова с Марьей Ивановной."
      - "Учесть, что среди «её» детей могут быть пасынки или дети от другого брака: запись о рождении с обоими родителями или более ранняя роспись, где жив Иван Петров, проверяет и отца, и мать."

  - id: fork_two_priest_parish_half_in_volume
    request: "Ищу брак крестьянина в селе N за 1750-е годы. В годовых томах метрик консистории на FamilySearch за пять лет подряд есть книга села N, нужного жениха в браках нет. Записываем «брака 1750–1754 в книгах села нет»?"
    expected:
      - "Проверить, не делилось ли село между двумя священниками: каждая половина подавала свою книгу, и в годовом томе может лежать только одна."
      - "По исповедной ведомости определить, в какой половине числилась семья, и по заголовку, подписи или деревням в записях — какая половина в томе; сопоставлять по дворам и деревням, а не только по имени священника."
      - "Брак записывал венчавший священник, а венчать могли в половине невесты: проверить книги обеих половин."
      - "По реестру сёл на первых кадрах тома оценить, сколько книг села в томе, как первую проверку; проверить титулы всего тома (вторая книга может стоять не рядом) и отметить в охвате, как определено число книг."
      - "Отрицательный результат записать только для просмотренной половины; книги другой половины — в архивный запрос, если онлайн их нет."

  - id: fork_votchina_books_in_other_board
    request: "Село N до 1764 года было монастырской вотчиной, а позже числилось в уезде A. В томах метрик уезда A за 1750-е на FamilySearch книг села нет. Пишем «метрик 1750-х онлайн нет»?"
    expected:
      - "Установить, к какому духовному правлению или заказу село относилось на дату записи: книги вотчинного села могли подаваться через другое правление."
      - "Найти перечень книг прихода с архивными шифрами: фонд в шифре показывает правление; затем проверить тома этого правления."
      - "Учесть, что исповедные ведомости и метрики могли числиться по разным уездам или правлениям."
      - "До проверки всех относящихся групп писать пробел охвата, а не «книг нет онлайн»."

  - id: fork_father_surname_from_childrens_marriages
    request: "Крестьянин середины XIX века записан в рождениях своих детей без фамилии, а его сыновья в следующем поколении — с фамилией. Как узнать фамилию отца? Искать запись о его смерти?"
    expected:
      - "Читать и браки его детей, включая дочерей: в брачной записи отца жениха или невесты пишут полнее, бывает, что с фамилией, а раздел браков короче раздела умерших; браки сыновей искать и в приходе невесты."
      - "Фамилия отца в брачной записи может отличаться от поздней фамилии детей (прозвание): сохранить обе формы и проверять по рождениям детей того же человека, не сливая сразу."
      - "Брак ребёнка полезен и тогда, когда отец уже умер («умершего»); запись о смерти полезна только в окне его смерти."

  - id: fork_death_age_summary_as_filter
    request: "Ищу смерть женщины около 80 лет, окно — 10 лет, в каждом году раздел умерших — 15–20 кадров, фамилий у крестьян нет. Как сократить чтение?"
    expected:
      - "Проверить, есть ли в конце книги годовая сводка умерших по возрастам и полу; по ней найти годы и записи с женщинами подходящего возраста и читать только их."
      - "Ожидаемый возраст брать с допуском в обе стороны: возраст стариков часто округлён, бывает завышен или занижен."
      - "В охвате записать способ отбора по сводке и допуск, прочитанных и отклонённых — с именами и возрастами; если число записей не сходится со сводкой, читать год целиком."
      - "Отрицательный результат записать как «не найдено среди отобранных по сводке»: сводка может ошибаться в графах возраста или пола при верном итоге; для существенного вывода дочитать годы или расширить допуск."

  - id: fork_year_read_only_when_complete
    request: "Читаем смерти 1903 года по группе снимков FamilySearch, по вырезкам левой страницы разворота: книга обрывается на июле, итоговой таблицы года нет. Записываем «смерти 1903 прочитаны, нашего нет»?"
    expected:
      - "Не считать год прочитанным: книга может продолжаться на другой плёнке (кадр вроде «Continued on another roll»); найти продолжение и стык, итог года — если он есть."
      - "Проверить, нет ли в том же томе ещё одной копии книги того же года, где раздел полнее (по реестру или описи тома, если они есть)."
      - "Нужную часть проверять до последнего месяца; начало части подтверждать по шапке граф, а не по месту титульного листа."
      - "Проверить форму книги этого года: если все графы на одной странице, записи идут на обеих страницах разворота."
      - "До проверки записать охват с непрочитанными месяцами."
